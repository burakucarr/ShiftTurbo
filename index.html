<!DOCTYPE html>

<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <title>ShiftTurbo | Ultimate Terminal</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;700;900&family=Orbitron:wght@200;500;700;900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* 🚨 UcR TECHNOLOGY - PREMİUM BRAND BADGE CSS */

        .ucr-badge {

            position: fixed !important;

            bottom: 18px !important;

            right: 20px !important;

            display: flex !important;

            align-items: center !important;

            gap: 10px !important;

            font-family: 'Segoe UI', sans-serif;

            font-size: 13px;

            font-weight: 600;

            color: #ffffff;

            padding: 8px 16px;

            background: rgba(20, 20, 20, 0.65);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            border-radius: 12px;

            border: 1px solid rgba(255, 255, 255, 0.1);

            box-shadow: 0 0 15px rgba(244, 129, 32, 0.3), 0 0 30px rgba(0, 0, 0, 0.5);

            z-index: 2147483647 !important;

            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);

            cursor: default;

            user-select: none;

        }



        .ucr-dot {

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: #f48120;

            box-shadow: 0 0 8px #f48120, 0 0 16px #f48120;

            animation: ucrPulse 2s infinite ease-in-out;

        }



        @keyframes ucrPulse {

            0% { transform: scale(1); opacity: 1; }

            50% { transform: scale(1.3); opacity: 0.7; }

            100% { transform: scale(1); opacity: 1; }

        }



        .ucr-badge:hover {

            transform: translateY(-5px) scale(1.02);

            box-shadow: 0 0 25px rgba(244, 129, 32, 0.6);

            background: rgba(30, 30, 30, 0.8);

            border-color: rgba(244, 129, 32, 0.5);

        }



        :root { --primary: #f48120; --bg: #030712; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1); --success: #10b981; --error: #ef4444; }

        

        body { 

            font-family: 'Poppins', sans-serif; 

            background: var(--bg); 

            margin: 0; 

            display: flex; 

            justify-content: center; 

            align-items: center; 

            min-height: 100vh; 

            color: white; 

            overflow: hidden;

            position: fixed;

            width: 100%;

        }



        body::before {

            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;

            background: linear-gradient(rgba(244, 129, 32, 0.05) 1px, transparent 1px), 

                        linear-gradient(90deg, rgba(244, 129, 32, 0.05) 1px, transparent 1px);

            background-size: 30px 30px; pointer-events: none; z-index: -1;

        }



        body::after {

            content: ""; position: fixed; top: -100%; left: 0; width: 100%; height: 100%;

            background: linear-gradient(to bottom, transparent, rgba(244, 129, 32, 0.1), transparent);

            animation: dataStream 6s linear infinite; 

            pointer-events: none; 

            z-index: -1;

            will-change: transform;

        }



        @keyframes dataStream { 0% { transform: translateY(0); } 100% { transform: translateY(200%); } }


        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes scannerGlow { 0% { box-shadow: 0 0 5px var(--primary); } 50% { box-shadow: 0 0 25px var(--primary); } 100% { box-shadow: 0 0 5px var(--primary); } }

        @keyframes statusBarPulse { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.6; filter: brightness(1.5); } }



        .shake { animation: shake 0.3s ease-in-out; border-color: var(--error) !important; }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        

        #status-bar { position: absolute; top: 0; left: 0; width: 0%; height: 4px; background: var(--primary); transition: 1s; box-shadow: 0 0 15px var(--primary); z-index: 100; animation: statusBarPulse 3s infinite ease-in-out; }

        .brand-signature { position: absolute; top: 30px; text-align: center; width: 100%; z-index: 10; }

        .brand-logo-text { font-family: 'Orbitron', sans-serif; font-size: 16px; letter-spacing: 8px; font-weight: 900; color: #fff; text-transform: uppercase; margin-bottom: 5px; }

        .brand-logo-text span { color: var(--primary); }

        .brand-slogan { font-family: 'Poppins', sans-serif; font-size: 9px; font-weight: 900; letter-spacing: 4px; color: var(--primary); text-transform: uppercase; display: block; }

        

        .card { background: var(--glass); padding: 2.5rem 1.5rem; border-radius: 30px; text-align: center; max-width: 380px; width: 90%; backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px); box-shadow: 0 40px 100px rgba(0,0,0,0.6); border: 1px solid var(--border); position: relative; margin-top: 20px; height: max-content; }

        .card::before { top: -1px; left: -1px; border-top: 2px solid var(--primary); border-left: 2px solid var(--primary); border-radius: 30px 0 0 0; position: absolute; content: ""; width: 20px; height: 20px; }

        .card::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--primary); border-right: 2px solid var(--primary); border-radius: 0 0 30px 0; position: absolute; content: ""; width: 20px; height: 20px; }

        

        .time-display { font-family: 'Orbitron', sans-serif; font-size: 64px; font-weight: 200; line-height: 1; letter-spacing: -3px; background: linear-gradient(180deg, #fff 40%, rgba(255,255,255,0.3) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }

        .date-display { font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 300; color: rgba(255, 255, 255, 0.4); letter-spacing: 5px; text-transform: uppercase; margin-top: 5px; display: block; }

        

        .status-icons { display: flex; justify-content: center; gap: 12px; margin-top: 10px; opacity: 0.4; }

        .icon-item { font-size: 8px; font-family: 'Orbitron'; letter-spacing: 1px; color: var(--primary); display: flex; align-items: center; gap: 4px; }

        .blink { animation: statusBarPulse 2s infinite; }



        button { padding: 20px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; color: white; font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 1.5px; font-size: 11px; width: 100%; margin-top: 25px; }

        .btn-scan { display: none; background: linear-gradient(135deg, var(--primary), #d96d00); animation: scannerGlow 2.5s infinite ease-in-out; }

        .btn-in { background: linear-gradient(135deg, #10b981, #059669); }

        .btn-out { background: linear-gradient(135deg, #ef4444, #b91c1c); }

        

        #reader { width: 100%; border-radius: 15px; overflow: hidden; margin-top: 15px; border: 1px solid var(--border); display: none; }

        #pin-pad { display: none; margin-top: 15px; }

        .pin-input { background: rgba(0,0,0,0.4); border: 1px solid var(--primary); padding: 12px; border-radius: 12px; font-family: 'Orbitron'; font-size: 20px; letter-spacing: 12px; color: var(--primary); width: 70%; margin: 0 auto 15px; text-align: center; }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 220px; margin: 0 auto; }

        .num-btn { padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-family: 'Orbitron'; font-size: 16px; cursor: pointer; transition: 0.1s; }

        .num-btn:active { background: var(--primary); color: black; box-shadow: 0 0 20px var(--primary); transform: scale(0.95); }



        #action-confirm { display: none; margin-top: 15px; padding: 20px; background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px solid var(--border); }

        .btn-mini { padding: 12px; font-size: 9px; margin-top: 10px; }

        #confirm-box { display: none; margin-top: 15px; padding: 15px; background: rgba(244, 129, 32, 0.05); border-radius: 20px; border: 1px dashed rgba(244, 129, 32, 0.3); }

        #status { margin-top: 30px; font-size: 8px; color: #475569; letter-spacing: 2px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }



        .arch-signature { margin-top: 30px; opacity: 0.25; pointer-events: none; transition: opacity 0.5s ease; }

        .arch-label { font-family: 'Orbitron'; font-size: 6px; letter-spacing: 3px; color: var(--primary); display: block; margin-bottom: 2px; }

        .arch-name { font-family: 'Orbitron'; font-size: 9px; font-weight: 400; color: rgba(255, 255, 255, 0.7); letter-spacing: 2px; }



        .btn-message { margin-top: 10px; padding: 10px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(244, 129, 32, 0.2); border-radius: 12px; font-size: 9px; font-family: 'Orbitron'; letter-spacing: 2px; color: rgba(255, 255, 255, 0.3) !important; cursor: pointer; transition: all 0.4s ease; width: 100%; }

        .btn-message:hover { background: rgba(244, 129, 32, 0.05); border-color: var(--primary); color: var(--primary) !important; box-shadow: 0 0 15px rgba(244, 129, 32, 0.2); }

        

        #message-modal, #error-modal { display: none; position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background: rgba(0,0,0,0.85) !important; backdrop-filter: blur(10px) !important; z-index: 999999 !important; align-items: center !important; justify-content: center !important; }

        .modal-content, .error-content { background: #0f172a !important; padding: 30px !important; border-radius: 25px !important; border: 2px solid var(--primary) !important; width: 85% !important; max-width: 320px !important; text-align: center !important; position: relative !important; box-shadow: 0 0 50px rgba(0,0,0,1); }

        .error-content { border-color: var(--error) !important; }

        textarea { width: 100%; height: 100px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: white; padding: 10px; font-family: 'Poppins'; margin: 15px 0; resize: none; outline: none; box-sizing: border-box; }

        .status-error { color: var(--error) !important; opacity: 1 !important; }
	@keyframes planeFly {
    	0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    	20% { transform: translate(-10px, 10px) scale(1.1) rotate(-10deg); }
    	100% { transform: translate(300px, -300px) scale(0) rotate(15deg); opacity: 0; }
	}

	.plane-animation {
   	display: inline-block;
    	font-size: 20px;
    	animation: planeFly 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
	}

	#status.success-glow {
    	color: var(--success) !important;
    	text-shadow: 0 0 15px var(--success);
    	transition: 0.3s;
	}

    </style>

</head>

<body>



    <div id="error-modal">

        <div class="error-content">

            <div style="font-family: 'Orbitron'; color: var(--error); font-size: 14px; letter-spacing: 4px; margin-bottom: 15px;">ERİŞİM REDDİ</div>

            <div id="error-msg-body" style="font-size: 12px; color: #cbd5e1; line-height: 1.6;"></div>

            <button class="btn-out btn-mini" onclick="location.reload()" style="margin-top:25px;">SİSTEMİ YENİLE</button>

        </div>

    </div>



    <div id="status-bar"></div>

    <div class="brand-signature">

        <div style="display: flex; align-items: center; justify-content: center; gap: 15px;">

            <div class="brand-logo-text">SHIFT<span>TURBO</span></div>

            <div style="height: 15px; width: 1px; background: rgba(255,255,255,0.2);"></div>

            <div style="font-family: 'Orbitron'; font-size: 8px; color: var(--primary); letter-spacing: 3px; opacity: 0.8;">PERSONEL TERMİNALİ</div>

        </div>

        <span class="brand-slogan">Zamanı Durdurma, Onu Yönet</span>

    </div>



    <div class="card" id="main-card">

        <div id="greeting" style="font-size: 9px; color: #475569; letter-spacing: 2px; margin-bottom: 15px; font-weight: 600;">SİSTEM BAĞLANTISI</div>

        <div id="clock" class="time-display">00:00</div>

        <div id="date" class="date-display">-- MART 2026</div>

        

        <div class="status-icons">

            <div class="icon-item blink">● KONUM_BAĞLANTISI</div>

            <div class="icon-item">● GÜVENLİ_AĞ</div>

            <div class="icon-item blink">● CANLI_VERİ</div>

        </div>



        <div id="reader"></div>

        <div id="ui-box">

            <button id="scanBtn" class="btn-scan" onclick="startQR()">📷 QR KİMLİK DOĞRULAMA</button>

            

            <div id="pin-pad" class="fade-in">

                <div class="pin-input" id="pin-display">****</div>

                <div class="numpad" id="numpad-grid"></div>

                <button class="btn-out btn-mini" onclick="location.reload()" style="background: #334155; margin-top: 10px;">İPTAL</button>

            </div>

            <div id="confirm-box" class="fade-in">

                <p id="user-check-text" style="font-size: 10px; letter-spacing: 1px; color: #94a3b8; font-family: 'Orbitron';"></p>

                <button class="btn-in btn-mini" onclick="verifySuccess()">EVET, BENİM</button>

                <button class="btn-out btn-mini" onclick="location.reload()" style="background: #334155; margin-top: 10px;">HAYIR, DEĞİLİM</button>

            </div>

            <div id="action-confirm" class="fade-in">

                <p id="action-text" style="font-size: 10px; letter-spacing: 1px; color: #fff; font-family: 'Orbitron'; margin-bottom: 10px;"></p>

                <button id="final-ok-btn" onclick="executeAction()">ONAYLIYORUM</button>

                <button class="btn-out btn-mini" onclick="cancelAction()" style="background: #334155; margin-top: 10px;">İPTAL</button>

            </div>

            <div id="main-actions"></div>

        </div>



        <div class="arch-signature" id="arch-sign">

            <span class="arch-label">SYSTEM ARCHITECT</span>

            <span class="arch-name">BURAK UÇAR</span>

        </div>

        

        <button class="btn-message" onclick="toggleModal(true)">📩 ŞİKAYET / ÖNERİ İLET</button>

        <div id="status">SHIFT TURBO GÜVENLİK SİSTEMİ</div>

    </div>



    <div id="message-modal">

        <div class="modal-content fade-in">

            <div style="font-family:'Orbitron'; font-size:10px; color:var(--primary); letter-spacing:2px;">MERKEZE NOT İLET</div>

            <textarea id="msg-area" placeholder="Mesajınızı buraya yazın..."></textarea>

            <button class="btn-in btn-mini" onclick="sendMessage()">GÖNDER</button>

            <button class="btn-out btn-mini" onclick="toggleModal(false)" style="background:#334155;">KAPAT</button>

        </div>

    </div>



    <div class="ucr-badge">

        <span class="ucr-dot"></span>

        UCR Technology

    </div>



    <script>

        const supabaseUrl = 'https://tnvjdppcyctmqkirlwmy.supabase.co';

        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRudmpkcHBjeWN0bXFraXJsd215Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzY0NTIsImV4cCI6MjA4ODMxMjQ1Mn0.Ft4JXQtbcXz1-qO7n06fV1vGtP4DbCVUWDojEAFoALI';

        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let html5QrCode = null;

        let currentPin = "";

        let pendingType = null;

        let autoTrackInterval = null;



        const playSound = (type) => {

            try {

                const context = new (window.AudioContext || window.webkitAudioContext)();

                const osc = context.createOscillator();

                const gain = context.createGain();

                osc.connect(gain); gain.connect(context.destination);

                if(type === 'success') { 

                    osc.type = 'triangle'; osc.frequency.setValueAtTime(440, context.currentTime);

                    osc.frequency.exponentialRampToValueAtTime(880, context.currentTime + 0.1);

                    gain.gain.setValueAtTime(0.1, context.currentTime);

                    gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.3);

                    osc.start(); osc.stop(context.currentTime + 0.3);

                } else if(type === 'error') { 

                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, context.currentTime); 

                    osc.frequency.linearRampToValueAtTime(50, context.currentTime + 0.2); 

                    gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.2); 

                    osc.start(); osc.stop(context.currentTime + 0.2);

                } else { 

                    osc.frequency.setValueAtTime(600, context.currentTime); osc.start(); 

                    gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.1); osc.stop(context.currentTime + 0.1); 

                }

            } catch(e) {}

        };



        function speakGreeting(name) {

            const firstName = name.split(' ')[0]; 

            const message = new SpeechSynthesisUtterance();

            message.text = `Hoş geldin ${firstName}. Kimliğin başarıyla doğrulandı.`;

            message.lang = 'tr-TR';

            window.speechSynthesis.speak(message);

        }



        function updateTime() {

            const now = new Date();

            document.getElementById('clock').innerText = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

            document.getElementById('date').innerText = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();

        }

        setInterval(updateTime, 1000); updateTime();



        function createNumPad() {

            const grid = document.getElementById('numpad-grid');

            const nums = [1,2,3,4,5,6,7,8,9,"C",0,"OK"];

            grid.innerHTML = nums.map(n => `<button class="num-btn" onclick="pressNum('${n}')">${n}</button>`).join('');

        }



        function pressNum(n) {

            playSound('tap');

            if (n === "C") { currentPin = ""; }

            else if (n === "OK") { checkPin(); return; }

            else { if(currentPin.length < 4) currentPin += n; }

            document.getElementById('pin-display').innerText = "*".repeat(currentPin.length) || "****";

            if(currentPin.length === 4) setTimeout(checkPin, 300);

        }



        async function startQR() {

            playSound('tap');

            document.getElementById('reader').style.display = 'block';

            document.getElementById('scanBtn').style.display = 'none';

            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start({ facingMode: "environment" }, { fps: 25, qrbox: 250 }, async (decodedText) => {

                if(decodedText.toUpperCase().includes("SHIFT")) {

                    playSound('success');

                    await html5QrCode.stop();

                    document.getElementById('reader').style.display = 'none';

                    document.getElementById('pin-pad').style.display = 'block';

                    createNumPad();

                }

            });

        }



        async function checkPin() {

            const { data } = await _supabase.from('users').select('ad_soyad').eq('pin', currentPin.trim());

            if (data && data.length > 0) {

                playSound('success');

                const fullName = data[0].ad_soyad;

                localStorage.setItem('temp_user_name', fullName);

                document.getElementById('pin-pad').style.display = 'none';

                document.getElementById('user-check-text').innerText = `MERHABA ${fullName.split(' ')[0].toUpperCase()}, GİRİŞ YAPAN SEN MİSİN?`;

                document.getElementById('confirm-box').style.display = 'block';

            } else { 

                playSound('error');

                document.getElementById('main-card').classList.add('shake');

                setTimeout(() => document.getElementById('main-card').classList.remove('shake'), 300);

                currentPin = ""; document.getElementById('pin-display').innerText = "****"; 

            }

        }



        function verifySuccess() {

            const fullName = localStorage.getItem('temp_user_name');

            speakGreeting(fullName);

            localStorage.setItem('shiftTurbo_user', fullName);

            localStorage.setItem('auth_active', 'true');

            localStorage.removeItem('temp_user_name');

            location.reload();

        }



        function requestConfirm(type) {

            playSound('tap'); pendingType = type;

            document.getElementById('main-actions').style.display = 'none';

            document.getElementById('action-confirm').style.display = 'block';

            const actionText = document.getElementById('action-text');

            const okBtn = document.getElementById('final-ok-btn');

            if(type === 'GİRİŞ') { actionText.innerText = "MESAİ BAŞLATILSIN MI?"; okBtn.className = "btn-in"; }

            else { actionText.innerText = "MESAİ BİTİRİLSİN MI?"; okBtn.className = "btn-out"; }

        }



        function cancelAction() { document.getElementById('action-confirm').style.display = 'none'; document.getElementById('main-actions').style.display = 'block'; }



        async function executeAction() {

            if (!pendingType) return;

            const type = pendingType;

            const name = localStorage.getItem('shiftTurbo_user');

            

            document.getElementById('action-confirm').style.display = 'none';

            document.getElementById('status').innerText = "⏳ GÜVENLİK SORGUSU YAPILIYOR...";



            // 🛡️ ÇİFT GİRİŞ ENGELLEME PROTOKOLÜ

            // Önce veritabanından bu personelin en son yaptığı işlemi çekiyoruz

            const { data: lastLogs, error: fetchError } = await _supabase

                .from('logs')

                .select('type')

                .eq('personel_name', name)

                .in('type', ['GİRİŞ', 'ÇIKIŞ']) // Sadece ana hareketlere bakıyoruz

                .order('created_at', { ascending: false })

                .limit(1);



            const lastAction = (lastLogs && lastLogs.length > 0) ? lastLogs[0].type : 'ÇIKIŞ';



            // Eğer personel GİRİŞ yapmak istiyorsa ama zaten sistemde GİRİŞ yapmış görünüyorsa DURDUR

            if (type === 'GİRİŞ' && lastAction === 'GİRİŞ') {

                playSound('error');

                document.getElementById('error-msg-body').innerText = "DİKKAT: Sistemde zaten aktif bir mesainiz bulunuyor. Üst üste giriş yapılamaz.";

                document.getElementById('error-modal').style.display = 'flex';

                document.getElementById('status').innerText = "❌ İŞLEM REDDEDİLDİ";

                return; // Kodu burada kes, veritabanına yeni kayıt atma

            }



            // Eğer her şey yolundaysa (veya ÇIKIŞ yapılıyorsa) işleme devam et

            navigator.geolocation.getCurrentPosition(async (pos) => {

                const { error } = await _supabase.from('logs').insert([{ 

                    personel_name: name, type: type, lat: pos.coords.latitude, lon: pos.coords.longitude, mahalle: "MERKEZ" 

                }]);



                if (!error) {

                    playSound('success');

                    if (type === 'ÇIKIŞ') {

                        // 🚨 ÖNCEKİ MESAJDAKİ GÜVENLİK: Çıkışta hafızayı siler

                        localStorage.clear(); 

                        setTimeout(() => { window.location.href = window.location.pathname; }, 500);

                    } else {

                        localStorage.setItem('isShiftActive', 'true');

                        location.reload();

                    }

                } else {

                    document.getElementById('error-msg-body').innerText = "Bulut bağlantı hatası.";

                    document.getElementById('error-modal').style.display = 'flex';

                }

            }, (err) => {

                document.getElementById('error-msg-body').innerText = "Konum izni gerekli.";

                document.getElementById('error-modal').style.display = 'flex';

            }, { enableHighAccuracy: true });

        }



        function toggleModal(show) { document.getElementById('message-modal').style.display = show ? 'flex' : 'none'; }

        

        async function sendMessage() {

            const msg = document.getElementById('msg-area').value.trim();

            // Hafızada isim varsa al, yoksa "MİSAFİR / BİLİNMEYEN" yaz

            let user = localStorage.getItem('shiftTurbo_user');

            if (!user) {

                user = "BİLİNMEYEN PERSONEL (KAYITSIZ)";

            }

            

            if(!msg) return;

            

            toggleModal(false);

            document.getElementById('status').innerText = "⏳ MESAJ İLETİLİYOR...";



            // Konum alınamasa bile mesajın her türlü gitmesini sağlayan garanti blok

            navigator.geolocation.getCurrentPosition(async (pos) => {

                await _supabase.from('logs').insert([{ 

                    personel_name: user, 

                    type: 'MESAJ', 

                    mahalle: msg, 

                    lat: pos.coords.latitude, 

                    lon: pos.coords.longitude 

                }]);

                finishMessage();

            }, async (err) => {

                // Konum izni yoksa 0,0 koordinatıyla gönder

                await _supabase.from('logs').insert([{ 

                    personel_name: user, 

                    type: 'MESAJ', 

                    mahalle: msg, 

                    lat: 0, 

                    lon: 0 

                }]);

                finishMessage();

            });

        }



       // ESKİ HALİNİ SİL, BUNU YAPIŞTIR
function finishMessage() {
    playSound('success'); 
    
    // 🗣️ Sesli Geri Bildirim (Tarayıcı konuşur)
    const message = new SpeechSynthesisUtterance();
    message.text = "Mesajınız başarıyla merkeze iletildi.";
    message.lang = 'tr-TR';
    window.speechSynthesis.speak(message);

    const statusEl = document.getElementById('status');
    // ✈️ Kağıt uçak emojisi buraya ekleniyor
    statusEl.innerHTML = `<span class="plane-animation">✈️</span> ✅ MESAJ MERKEZE İLETİLDİ`;
    statusEl.classList.add('success-glow');

    document.getElementById('msg-area').value = ""; 
    
    setTimeout(() => { 
        statusEl.innerHTML = "SHIFT TURBO GÜVENLİK SİSTEMİ"; 
        statusEl.classList.remove('success-glow');
    }, 4000);
}


        window.onload = () => {

            const user = localStorage.getItem('shiftTurbo_user');

            const auth = localStorage.getItem('auth_active') === 'true';

            const isActive = localStorage.getItem('isShiftActive') === 'true';

            const scanBtn = document.getElementById('scanBtn');

            const mainActions = document.getElementById('main-actions');



            if (user && auth && isActive) {

                document.getElementById('status-bar').style.width = "100%";

                document.getElementById('greeting').innerText = "SYSTEM ACTIVE / " + user.toUpperCase();

                mainActions.innerHTML = `<button class="btn-out" onclick="requestConfirm('ÇIKIŞ')">MESAİ BİTİR</button>`;

            } else if (user && auth && !isActive) {

                document.getElementById('status-bar').style.width = "50%";

                document.getElementById('greeting').innerText = "SYSTEM READY / " + user.toUpperCase();

                mainActions.innerHTML = `<button class="btn-in" onclick="requestConfirm('GİRİŞ')">MESAİ BAŞLAT</button>`;

            } else {

                scanBtn.style.display = 'block';

            }

        }

    </script>
