    <script>
        const supabaseUrl = 'https://tnvjdppcyctmqkirlwmy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRudmpkcHBjeWN0bXFraXJsd215Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzY0NTIsImV4cCI6MjA4ODMxMjQ1Mn0.Ft4JXQtbcXz1-qO7n06fV1vGtP4DbCVUWDojEAFoALI';

        async function fetchData() {
document.getElementById('staffFilter').value = 'all';
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
            const { data } = await _supabase.from('logs').select('*').order('created_at', { ascending: false });
            
            // 🚨 ÖNEMLİ: Temizleme mantığını mesajları kapsayacak şekilde esnetiyoruz
            const cleanData = [];
            const seenActions = new Set();
            
            (data || []).forEach(log => {
                // Mesajlar asla kopya sayılmasın (her mesaj değerlidir)
                const timeKey = log.type === 'MESAJ' ? `msg-${log.id}` : `${log.personel_name}-${log.created_at}`;
                if (!seenActions.has(timeKey)) { 
                    cleanData.push(log); 
                    seenActions.add(timeKey); 
                }
            });

            allLogs = cleanData.map(log => ({
                id: log.id,
                // Eğer isim boş gelirse bilinmeyen olarak işaretle
                personel: (log.personel_name || "BILINMEYEN_MISAFIR").trim().toUpperCase('tr-TR'),
                type: log.type, 
                mahalle: log.mahalle, 
                lat: log.lat, 
                lon: log.lon,
                time: new Date(log.created_at).toLocaleString('tr-TR'), 
                raw_time: log.created_at
            }));

            updateTrendGraph(); 
            runAIAnalysis(); 
            updateDashboard(); 
            
            // 🔊 BİLİNMEYEN PERSONEL MESAJI GELDİĞİNDE BİLDİRİMİ TETİKLE
            checkNewNotifications(allLogs);
        }

        function updateTrendGraph() {
            const points = []; const hours = 7; const now = new Date();
            for(let i=0; i<=hours; i++) {
                const targetTime = new Date(now.getTime() - (i * 3600000));
                const count = allLogs.filter(l => new Date(l.raw_time).getHours() === targetTime.getHours()).length;
                points.push(30 - (Math.min(count, 5) * 5));
            }
            const pathData = points.reverse().map((p, i) => `${i === 0 ? 'M' : 'L'}${i * 15},${p}`).join(' ');
            if(document.getElementById('trendPath')) document.getElementById('trendPath').setAttribute('d', pathData);
        }

        function calculateScore(personName) {
            let score = 100; const personLogs = allLogs.filter(l => l.personel === personName);
            personLogs.forEach(log => { if(log.type === 'GİRİŞ') { const isLast = allLogs.filter(l => l.personel === log.personel)[0] === log; if(isLast && (new Date() - new Date(log.raw_time)) / 3600000 > 10) score -= 15; } });
            score += Math.floor(personLogs.length / 5) * 2; return Math.min(Math.max(score, 0), 100);
        }

       function runAIAnalysis() {
            const names = [...new Set(allLogs.map(l => l.personel))]
                            .filter(n => !n.includes("BILINMEYEN") && !n.includes("BİLİNMEYEN"));
            
            if (names.length === 0) {
                document.getElementById('ai-text').innerHTML = "🧠 Veri akışı bekleniyor...";
                return;
            }

            let activeStaff = 0;
            let criticalCount = 0;
            let bestPerson = { name: "", score: -1 };
            let remoteStaffNames = []; // Dışarıdan girenlerin isimlerini tutacak liste
            let totalActionsToday = allLogs.filter(l => new Date(l.raw_time).toDateString() === new Date().toDateString()).length;

            // 📍 DÜKKAN KOORDİNATLARI (Buraları dükkanının konumuyla güncelle!)
            const shopLat = 41.0000; 
            const shopLon = 28.0000; 

            names.forEach(name => {
                const logs = allLogs.filter(l => l.personel === name);
                const lastAction = logs.find(l => l.type === 'GİRİŞ' || l.type === 'ÇIKIŞ');
                const score = calculateScore(name);
                
                if(score > bestPerson.score) { bestPerson = { name, score }; }
                
                if(lastAction && lastAction.type === 'GİRİŞ') {
                    activeStaff++;
                    const hoursInShift = (new Date() - new Date(lastAction.raw_time)) / 3600000;
                    if(hoursInShift > 10) criticalCount++;
                    
                    // Mesafe Kontrolü: 0.001 yaklaşık 100 metredir. 
                    // 0.005'ten büyükse dükkanda değildir.
                    const distLat = Math.abs(lastAction.lat - shopLat);
                    const distLon = Math.abs(lastAction.lon - shopLon);
                    if(distLat > 0.005 || distLon > 0.005) {
                        remoteStaffNames.push(name); // Hile şüphelisini listeye ekle
                    }
                }
            });

            const aiText = document.getElementById('ai-text');
            let aiMsg = "";

            // 1. Durum Analizi (Hile ve Anomali Tespiti)
            if (remoteStaffNames.length > 0) {
                aiMsg += `📍 <b style="color:#f48120">DIŞ MEKAN GİRİŞİ:</b> <span style="color:#fff; background:#ef4444; padding:2px 6px; border-radius:4px;">${remoteStaffNames.join(", ")}</span> dükkan dışından işlem yaptı! `;
            } else if (criticalCount > 0) {
                aiMsg += `⚠️ <b style="color:#ef4444">KRİTİK DURUM:</b> Mesaisi 10 saati aşanlar var. `;
            } else {
                aiMsg += `✅ <b style="color:#10b981">GÜVENLİ:</b> Tüm personel dükkan sınırları içerisinde. `;
            }

            // 2. Performans Raporu
            aiMsg += `<br>📊 <b>ÖZET:</b> Bugün ${totalActionsToday} işlem. En disiplinli: <b>${bestPerson.name}</b>.`;
            
            // 3. AI Tavsiyesi
            if (activeStaff > 0) {
                aiMsg += `<br>🚀 <b>SAHA:</b> Şu an ${activeStaff} personel aktif görevde.`;
            }

            if(aiText) aiText.innerHTML = aiMsg;
        }
        function calculateRowDuration(currentLog, logs) {
            const personLogs = logs.filter(l => l.personel === currentLog.personel).sort((a, b) => new Date(a.raw_time) - new Date(b.raw_time));
            const lastGiris = personLogs.filter(l => new Date(l.raw_time) <= new Date(currentLog.raw_time) && l.type === 'GİRİŞ').pop();
            if (!lastGiris) return "BAŞLANGIÇ YOK";
            const followingCikis = personLogs.filter(l => new Date(l.raw_time) > new Date(lastGiris.raw_time) && l.type === 'ÇIKIŞ')[0];
            let endTime = followingCikis ? new Date(followingCikis.raw_time) : new Date();
            let diff = Math.max(0, endTime - new Date(lastGiris.raw_time));
            return `${Math.floor(diff / 3600000)}s ${Math.floor((diff % 3600000) / 60000)}dk`;
        }

      function checkCriticalAlert(log, all) {
    // Sadece 'GİRİŞ' satırlarında uyarı gösterelim
    if (log.type !== 'GİRİŞ') return false;

    // Bu personelin TÜM hareketlerini zamana göre diz (en yeni en üstte)
    const personLogs = all.filter(l => l.personel === log.personel);
    
    // Personelin yaptığı EN SON ana işlemi bul (GİRİŞ mi ÇIKIŞ mı?)
    // find() mesajları atlasın diye tip kontrolü yapıyoruz
    const lastMainAction = personLogs.find(l => l.type === 'GİRİŞ' || l.type === 'ÇIKIŞ');

    // KRİTİK KONTROL 1: Eğer personelin son işlemi ÇIKIŞ ise, o zaten evindedir. Alarm verme!
    if (lastMainAction && lastMainAction.type === 'ÇIKIŞ') return false;

    // KRİTİK KONTROL 2: Eğer baktığımız bu satır, personelin EN SON giriş kaydı değilse alarm verme!
    // (Eski girişleri kırmızı boyayıp kafa karıştırmasın)
    const lastGiris = personLogs.find(l => l.type === 'GİRİŞ');
    if (lastGiris && lastGiris.id !== log.id) return false;

    // KRİTİK KONTROL 3: Zaman hesabı
    const girisZamani = new Date(log.raw_time);
    const simdi = new Date();
    const farkSaat = (simdi - girisZamani) / 3600000;

    // Eğer şu an hala içerideyse VE 10 saati geçmişse KIRMIZI YAK!
    return farkSaat > 10;
}

        function updateDashboard() {
            const names = [...new Set(allLogs.map(l => l.personel))].sort();
            document.getElementById('staffFilter').innerHTML = '<option value="all">TÜMÜ</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
            document.getElementById('stat-total').innerText = allLogs.length;
            let realActiveCount = 0;
            names.forEach(name => {
                const personLogs = allLogs.filter(l => l.personel === name);
                const lastMainAction = personLogs.find(l => l.type === 'GİRİŞ' || l.type === 'ÇIKIŞ');
                if(lastMainAction && lastMainAction.type === 'GİRİŞ') realActiveCount++;
            });
            document.getElementById('stat-staff').innerText = realActiveCount;
            document.getElementById('stat-today').innerText = allLogs.filter(l => new Date(l.raw_time).toDateString() === new Date().toDateString()).length;
            applyFilter();
        }

        function applyFilter() {
            const staff = document.getElementById('staffFilter').value;
            const sD = document.getElementById('startDate').value;
            const eD = document.getElementById('endDate').value;
            let filtered = allLogs;
            if (staff !== "all") filtered = filtered.filter(l => l.personel === staff);
            if (sD) filtered = filtered.filter(l => new Date(l.raw_time) >= new Date(sD));
            if (eD) filtered = filtered.filter(l => new Date(l.raw_time) <= new Date(eD + "T23:59:59"));
            
           document.getElementById('logTable').innerHTML = filtered.map(log => {
    const isCrit = checkCriticalAlert(log, allLogs);
    const score = calculateScore(log.personel);
    const isNew = (new Date() - new Date(log.raw_time)) < 30000;
    const isMessage = log.type === 'MESAJ';
    const isUnknown = log.personel.includes("BILINMEYEN") || log.personel.includes("BİLİNMEYEN");
    const durationText = calculateRowDuration(log, allLogs); // Süre hesaplamayı unutma
    
    const clickAction = isMessage ? `onclick="showMsg('${log.personel}', '${log.mahalle.replace(/'/g, "\\'")}', '${log.time}')"` : "";
    const badgeStyle = isMessage ? 'background: #9333ea; cursor: pointer; border-color: #a78bfa;' : '';
    const displayText = isMessage ? '📩 MESAJI OKU' : log.type;
    const noteText = isMessage ? '📝 Personel Bildirimi Gönderdi' : log.mahalle;
    const scoreBox = !isUnknown ? `<div class="score-box ${score < 70 ? 'low-score' : ''}">⭐ ${score} Puan</div>` : '';

    // İŞTE DEĞİŞECEK OLAN ANA YAPI:
    return `<tr class="${isCrit ? 'critical-alarm' : ''} ${isNew ? 'new-action-row' : ''}">
        <td>
            <b>${log.personel}</b><br>
            ${scoreBox}
            ${isCrit ? '<br><span class="critical-badge">⚠️ 10 SAAT+ MESAİ</span>' : ''} 
        </td>
        <td>
            <span class="badge ${log.type}" ${clickAction} style="${badgeStyle}">${displayText}</span><br>
            <small style="color:var(--primary); font-weight:700;">⏱️ ${durationText}</small>
        </td>
        <td><div class="${isMessage ? 'msg-text-truncate' : ''}">${noteText}</div><br><a href="http://googleusercontent.com/maps.google.com/?q=${log.lat},${log.lon}" target="_blank" style="color:#3b82f6; font-size:10px; font-weight:700; text-decoration:none;">📍 KONUM</a></td>
        <td><small>${log.time}</small></td>
    </tr>`;
}).join('');
        }
function filterActiveStaff() {
    const names = [...new Set(allLogs.map(l => l.personel))];
    const activeLogsOnly = [];

    names.forEach(name => {
        // Personelin tüm loglarını al
        const personLogs = allLogs.filter(l => l.personel === name);
        
        // 🚨 KRİTİK DÜZELTME: Mesajları filtre dışı bırak, sadece GİRİŞ veya ÇIKIŞ'a bak
        const lastWorkAction = personLogs.find(l => l.type === 'GİRİŞ' || l.type === 'ÇIKIŞ');

        // Eğer en son yaptığı ana işlem GİRİŞ ise, dükkandadır (arada mesaj atmış olsa bile)
        if(lastWorkAction && lastWorkAction.type === 'GİRİŞ') {
            activeLogsOnly.push(lastWorkAction);
        }
    });

    const logTable = document.getElementById('logTable');
    if (activeLogsOnly.length === 0) {
        logTable.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:50px; opacity:0.5; font-family:'Orbitron';">Şu an dükkanda aktif personel bulunmuyor.</td></tr>`;
    } else {
        renderCustomTable(activeLogsOnly); 
    }

    document.getElementById('staffFilter').value = 'all';
    document.getElementById('ai-text').innerHTML = `⚡ <b>GÜNCEL TAKİP:</b> Personel mesaj gönderse dahi mesai takibi devam eder. Şu an ${activeLogsOnly.length} personel içeride.`;
}
function renderCustomTable(data) {
    document.getElementById('logTable').innerHTML = data.map(log => {
        const isCrit = checkCriticalAlert(log, allLogs);
        const score = calculateScore(log.personel);
        const isMessage = log.type === 'MESAJ';
        const durationText = calculateRowDuration(log, allLogs);
        
        const clickAction = isMessage ? `onclick="showMsg('${log.personel}', '${log.mahalle.replace(/'/g, "\\'")}', '${log.time}')"` : "";
        const badgeStyle = isMessage ? 'background: #9333ea; cursor: pointer; border-color: #a78bfa;' : '';
        const displayText = isMessage ? '📩 MESAJI OKU' : log.type;

        // İŞTE DEĞİŞECEK OLAN ANA YAPI:
        return `<tr class="${isCrit ? 'critical-alarm' : ''}">
            <td>
                <b>${log.personel}</b><br>
                <div class="score-box ${score < 70 ? 'low-score' : ''}">⭐ ${score} Puan</div>
                ${isCrit ? '<br><span class="critical-badge">⚠️ 10 SAAT+ MESAİ</span>' : ''} 
            </td>
            <td>
                <span class="badge ${log.type}" ${clickAction} style="${badgeStyle}">${displayText}</span><br>
                <small style="color:var(--primary); font-weight:700;">⏱️ ${durationText}</small>
            </td>
            <td>${log.mahalle}<br><a href="http://googleusercontent.com/maps.google.com/?q=${log.lat},${log.lon}" target="_blank" style="color:#3b82f6; font-size:10px; font-weight:700; text-decoration:none;">📍 KONUM</a></td>
            <td>
                <i class="far fa-clock time-icon"></i>
                <span class="log-time-highlight">${log.time.split(' ')[1]}</span><br>
                <small style="font-size: 9px; opacity: 0.6;">${log.time.split(' ')[0]}</small>
            </td>
        </tr>`;
    }).join('');
}

        function showMsg(person, text, time) {
            document.getElementById('msg-body').innerHTML = `<b style="color:white;">${person}:</b><br><br>"${text}"`;
            document.getElementById('msg-time-footer').innerText = `GÖNDERİM ZAMANI: ${time}`;
            document.getElementById('msg-modal').style.display = 'flex';
        }

        function closeMsg() { document.getElementById('msg-modal').style.display = 'none'; }

        function exportPDF() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            const now = new Date();
            const clearTR = (text) => text ? text.toString().replace(/İ/g, 'I').replace(/ı/g, 'i').replace(/Ş/g, 'S').replace(/ş/g, 's').replace(/Ğ/g, 'G').replace(/ğ/g, 'g').replace(/Ü/g, 'U').replace(/ü/g, 'u').replace(/Ö/g, 'O').replace(/ö/g, 'o').replace(/Ç/g, 'C').replace(/ç/g, 'c') : "";
            const summaryData = {}; const groupedLogs = {};
            allLogs.forEach(log => { if (!groupedLogs[log.personel]) groupedLogs[log.personel] = []; groupedLogs[log.personel].push(log); });
            Object.keys(groupedLogs).forEach(name => {
                const logs = groupedLogs[name].sort((a, b) => new Date(a.raw_time) - new Date(b.raw_time));
                let totalMs = 0; let shiftCount = 0; let lastGirisTime = null;
                logs.forEach(log => {
                    if (log.type === 'GİRİŞ') { shiftCount++; lastGirisTime = new Date(log.raw_time); } 
                    else if (log.type === 'ÇIKIŞ' && lastGirisTime) { totalMs += (new Date(log.raw_time) - lastGirisTime); lastGirisTime = null; }
                });
                if (lastGirisTime) totalMs += (now - lastGirisTime);
                summaryData[name] = { count: shiftCount, duration: `${Math.floor(totalMs / 3600000)}s ${Math.floor((totalMs % 3600000) / 60000)}dk` };
            });
            const summaryRows = Object.keys(summaryData).map(name => [clearTR(name), summaryData[name].count + " Kez", summaryData[name].duration]);
            doc.setFontSize(16); doc.text(clearTR("SHIFT TURBO - OPERASYONEL RAPOR"), 14, 15);
            doc.autoTable({ startY: 25, head: [['PERSONEL', 'MESAI SAYISI', 'TOPLAM SURE']], body: summaryRows, theme: 'grid', headStyles: { fillColor: [59, 130, 246] } });
            const detailRows = allLogs.map(l => [clearTR(l.personel), clearTR(l.type), clearTR(l.mahalle), l.time]);
            doc.autoTable({ startY: doc.lastAutoTable.finalY + 15, head: [['PERSONEL', 'ISLEM', 'BOLGE', 'ZAMAN']], body: detailRows, theme: 'striped', headStyles: { fillColor: [244, 129, 32] } });
            doc.save("ShiftTurbo_Rapor.pdf");
        }

        setInterval(() => { 
            const now = new Date();
            if(document.getElementById('liveClock')) document.getElementById('liveClock').innerText = now.toLocaleTimeString('tr-TR');
            if(document.getElementById('clock_login')) document.getElementById('clock_login').innerText = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
            if(document.getElementById('date_login')) document.getElementById('date_login').innerText = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
        }, 1000);

        window.onload = () => { if(sessionStorage.getItem("isAdmin") === "true") showPanel(); }

        function ensureSignature() {
            const badge = document.querySelector('.ucr-badge');
            if (badge && document.body.lastElementChild !== badge) {
                document.body.appendChild(badge);
                badge.style.display = 'flex';
            }
        }
        setInterval(ensureSignature, 1000);
    </script>
